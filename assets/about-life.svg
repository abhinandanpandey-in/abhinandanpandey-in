<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="About and Interests">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0c1326"/>
    </linearGradient>
    <linearGradient id="a-border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <style>
    .a-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .a-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .a-s1 { animation: aSlide 12s infinite; }
    .a-s2 { animation: aSlide 12s 4s infinite; opacity: 0; }
    .a-s3 { animation: aSlide 12s 8s infinite; opacity: 0; }
    .a-p1 { animation: aBar 12s infinite; transform-origin: left; }
    .a-p2 { animation: aBar 12s 4s infinite; transform-origin: left; }
    .a-p3 { animation: aBar 12s 8s infinite; transform-origin: left; }
    @keyframes aSlide {
      0%, 2% { opacity: 0; }
      6%, 30% { opacity: 1; }
      34%, 100% { opacity: 0; }
    }
    @keyframes aBar {
      0% { transform: scaleX(0); }
      33% { transform: scaleX(1); }
      34%, 100% { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .a-s1 { animation: none; opacity: 1; }
      .a-s2, .a-s3 { animation: none; opacity: 0; }
      .a-p1, .a-p2, .a-p3 { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="998" height="318" rx="22" fill="url(#a-bg)" stroke="url(#a-border)" stroke-width="1.5"/>

  <text x="48" y="46" fill="#247bff" font-size="11" font-weight="700" letter-spacing="2" class="a-mono">ABOUT / WHAT I WORK ON</text>
  <text x="48" y="82" fill="#f4f7ff" font-size="28" font-weight="800" class="a-sans">Adversarial thinking.</text>
  <text x="48" y="114" fill="#f4f7ff" font-size="28" font-weight="800" class="a-sans">Practical security.</text>
  <text x="48" y="144" fill="#9fb0cc" font-size="13.5" class="a-sans">Exploring the boundaries of LLM applications, agent workflows, and tool-use security.</text>

  <g transform="translate(48, 172)">
    <rect x="0" y="0" width="238" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#247bff" stroke-opacity="0.35"/>
    <text x="16" y="27" fill="#e6eeff" font-size="13" font-weight="600" class="a-sans">LLM / Agent Red Teaming</text>

    <rect x="252" y="0" width="238" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff354f" stroke-opacity="0.35"/>
    <text x="268" y="27" fill="#e6eeff" font-size="13" font-weight="600" class="a-sans">Prompt Injection &amp; Guardrails</text>

    <rect x="0" y="56" width="238" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ff354f" stroke-opacity="0.35"/>
    <text x="16" y="83" fill="#e6eeff" font-size="13" font-weight="600" class="a-sans">MCP &amp; Tool-Hijacking Defense</text>

    <rect x="252" y="56" width="238" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#247bff" stroke-opacity="0.35"/>
    <text x="268" y="83" fill="#e6eeff" font-size="13" font-weight="600" class="a-sans">RAG Firewalls &amp; Sandboxing</text>
  </g>

  <rect x="576" y="32" width="380" height="256" rx="18" fill="#0b1328" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="604" y="66" fill="#ff354f" font-size="11" font-weight="700" letter-spacing="2" class="a-mono">OUTSIDE THE TERMINAL</text>

  <g class="a-s1">
    <text x="604" y="130" fill="#f4f7ff" font-size="34" font-weight="800" class="a-sans">Driving<tspan fill="#247bff">.</tspan></text>
    <text x="604" y="164" fill="#b7c2dc" font-size="14" class="a-sans">Late-night highways, open roads,</text>
    <text x="604" y="186" fill="#b7c2dc" font-size="14" class="a-sans">and clearing my head behind the wheel.</text>
  </g>

  <g class="a-s2">
    <text x="604" y="130" fill="#f4f7ff" font-size="34" font-weight="800" class="a-sans">Teasing<tspan fill="#ff354f">.</tspan></text>
    <text x="604" y="164" fill="#b7c2dc" font-size="14" class="a-sans">Keeping the banter alive with friends</text>
    <text x="604" y="186" fill="#b7c2dc" font-size="14" class="a-sans">and never taking life too seriously.</text>
  </g>

  <g class="a-s3">
    <text x="604" y="130" fill="#f4f7ff" font-size="34" font-weight="800" class="a-sans">Travelling<tspan fill="#247bff">.</tspan></text>
    <text x="604" y="164" fill="#b7c2dc" font-size="14" class="a-sans">Exploring new places, new routes,</text>
    <text x="604" y="186" fill="#b7c2dc" font-size="14" class="a-sans">and collecting stories outside the screen.</text>
  </g>

  <rect x="604" y="232" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="604" y="232" width="100" height="4" rx="2" fill="#247bff" class="a-p1"/>
  <rect x="716" y="232" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="716" y="232" width="100" height="4" rx="2" fill="#ff354f" class="a-p2"/>
  <rect x="828" y="232" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="828" y="232" width="100" height="4" rx="2" fill="#247bff" class="a-p3"/>

  <text x="604" y="258" fill="#7c93bd" font-size="11" class="a-mono">· DRIVING      · TEASING      · TRAVELLING</text>
</svg>