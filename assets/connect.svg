<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Connect with Abhinandan Pandey</title><desc id="desc">Black and antique-gold GitHub profile section for Abhinandan Pandey.</desc><defs><linearGradient id="goldline" x1="0" x2="1"><stop stop-color="#6f5421"/><stop offset=".48" stop-color="#f2d27b"/><stop offset="1" stop-color="#7d6026"/></linearGradient><radialGradient id="glow"><stop stop-color="#d4af37" stop-opacity=".18"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d4af37" opacity=".17"/></pattern></defs><style>
