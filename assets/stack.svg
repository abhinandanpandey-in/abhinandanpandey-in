<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" role="img" aria-label="Tech Stack">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0d152a"/>
    </linearGradient>
    <linearGradient id="s-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <style>
    .s-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .s-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <rect x="1" y="1" width="998" height="378" rx="22" fill="url(#s-bg)" stroke="url(#s-border)" stroke-width="1.5"/>

  <text x="48" y="46" fill="#247bff" font-size="11" font-weight="700" letter-spacing="2" class="s-mono">STACK / SYSTEMS &amp; TOOLS</text>
  <text x="48" y="80" fill="#f4f7ff" font-size="26" font-weight="800" class="s-sans">The tools behind the work<tspan fill="#ff354f">.</tspan></text>

  <g transform="translate(260, 230)">
    <ellipse cx="0" cy="0" rx="175" ry="56" fill="none" stroke="#247bff" stroke-opacity="0.38" stroke-width="1.3" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="165" ry="52" fill="none" stroke="#ff354f" stroke-opacity="0.38" stroke-width="1.3" transform="rotate(20)"/>
    <ellipse cx="0" cy="0" rx="115" ry="38" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

    <circle cx="0" cy="0" r="34" fill="#101b36" stroke="#247bff" stroke-width="1.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#f4f7ff" font-size="13" font-weight="800" class="s-mono">LLM</text>

    <circle r="6" fill="#247bff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M -166,-54 A 175,56 -18 1,0 166,54 A 175,56 -18 1,0 -166,-54"/>
    </circle>
    <circle r="6" fill="#ff354f">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 155,56 A 165,52 20 1,0 -155,-56 A 165,52 20 1,0 155,56"/>
    </circle>
    <circle r="5" fill="#f4f7ff">
      <animateMotion dur="5s" repeatCount="indefinite" path="M -115,0 A 115,38 0 1,0 115,0 A 115,38 0 1,0 -115,0"/>
    </circle>

    <rect x="-185" y="-102" width="84" height="26" rx="13" fill="#0d1730" stroke="#247bff"/>
    <text x="-143" y="-85" text-anchor="middle" fill="#e6eeff" font-size="11" font-weight="700" class="s-mono">Python</text>

    <rect x="92" y="-102" width="96" height="26" rx="13" fill="#0d1730" stroke="#ff354f"/>
    <text x="140" y="-85" text-anchor="middle" fill="#e6eeff" font-size="11" font-weight="700" class="s-mono">Burp Suite</text>

    <rect x="-185" y="76" width="96" height="26" rx="13" fill="#0d1730" stroke="#ff354f"/>
    <text x="-137" y="93" text-anchor="middle" fill="#e6eeff" font-size="11" font-weight="700" class="s-mono">LangChain</text>

    <rect x="96" y="76" width="86" height="26" rx="13" fill="#0d1730" stroke="#247bff"/>
    <text x="139" y="93" text-anchor="middle" fill="#e6eeff" font-size="11" font-weight="700" class="s-mono">FastAPI</text>
  </g>

  <g transform="translate(530, 56)">
    <text x="0" y="0" fill="#a8c7ff" font-size="11" font-weight="700" letter-spacing="1.8" class="s-mono">LANGUAGES &amp; BACKEND</text>
    <rect x="0" y="14" width="128" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="64" y="35" text-anchor="middle" fill="#f4f7ff" font-size="12" class="s-mono">Python</text>
    <rect x="140" y="14" width="128" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="204" y="35" text-anchor="middle" fill="#f4f7ff" font-size="12" class="s-mono">FastAPI</text>
    <rect x="280" y="14" width="128" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="344" y="35" text-anchor="middle" fill="#f4f7ff" font-size="12" class="s-mono">Bash / JS</text>

    <text x="0" y="94" fill="#ff354f" font-size="11" font-weight="700" letter-spacing="1.8" class="s-mono">OFFENSIVE SECURITY &amp; CLOUD</text>
    <rect x="0" y="108" width="128" height="34" rx="10" fill="#ff354f" fill-opacity="0.12" stroke="#ff354f" stroke-opacity="0.45"/>
    <text x="64" y="129" text-anchor="middle" fill="#ffd6dc" font-size="12" class="s-mono">Burp Suite</text>
    <rect x="140" y="108" width="128" height="34" rx="10" fill="#ff354f" fill-opacity="0.12" stroke="#ff354f" stroke-opacity="0.45"/>
    <text x="204" y="129" text-anchor="middle" fill="#ffd6dc" font-size="12" class="s-mono">Kali Linux</text>
    <rect x="280" y="108" width="128" height="34" rx="10" fill="#ff354f" fill-opacity="0.12" stroke="#ff354f" stroke-opacity="0.45"/>
    <text x="344" y="129" text-anchor="middle" fill="#ffd6dc" font-size="12" class="s-mono">AWS / Nmap</text>

    <text x="0" y="188" fill="#247bff" font-size="11" font-weight="700" letter-spacing="1.8" class="s-mono">AI / LLM / RAG INFRA</text>
    <rect x="0" y="202" width="128" height="34" rx="10" fill="#247bff" fill-opacity="0.12" stroke="#247bff" stroke-opacity="0.45"/>
    <text x="64" y="223" text-anchor="middle" fill="#dce9ff" font-size="12" class="s-mono">LangChain</text>
    <rect x="140" y="202" width="128" height="34" rx="10" fill="#247bff" fill-opacity="0.12" stroke="#247bff" stroke-opacity="0.45"/>
    <text x="204" y="223" text-anchor="middle" fill="#dce9ff" font-size="12" class="s-mono">Ollama</text>
    <rect x="280" y="202" width="128" height="34" rx="10" fill="#247bff" fill-opacity="0.12" stroke="#247bff" stroke-opacity="0.45"/>
    <text x="344" y="223" text-anchor="middle" fill="#dce9ff" font-size="12" class="s-mono">FAISS</text>
  </g>
</svg>