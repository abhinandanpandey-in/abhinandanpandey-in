<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Technical stack</title><desc id="desc">Black and antique-gold GitHub profile section for Abhinandan Pandey.</desc><defs><linearGradient id="goldline" x1="0" x2="1"><stop stop-color="#6f5421"/><stop offset=".48" stop-color="#f2d27b"/><stop offset="1" stop-color="#7d6026"/></linearGradient><radialGradient id="glow"><stop stop-color="#d4af37" stop-opacity=".18"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d4af37" opacity=".17"/></pattern></defs><style>
:root{--bg:#080808;--gold:#d4af37;--pale:#f2ead7;--muted:#b8ad94;--line:#5b4821}
text{font-family:Arial,Helvetica,sans-serif} .gold{fill:#d4af37} .pale{fill:#f2ead7} .muted{fill:#b8ad94}
.kicker{letter-spacing:5px;fill:#d4af37}.heading{font-weight:700;letter-spacing:1px;fill:#f2ead7}.sub{fill:#b8ad94}.small{fill:#b8ad94}
.panel{fill:#12110e;stroke:#5b4821;stroke-width:1.4} .line{stroke:#d4af37;stroke-width:1.5;opacity:.8}
.pulse{animation:pulse 4s ease-in-out infinite} .rise{animation:rise 1s ease-out both}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.pulse,.rise{animation:none}}
</style><rect width="1200" height="360" rx="22" fill="#080808"/><rect width="1200" height="360" rx="22" fill="url(#dots)" opacity=".55"/><ellipse cx="950" cy="180.0" rx="340" ry="260" fill="url(#glow)"/><text x="60" y="64" class="kicker">02 / TECHNICAL STACK</text><text x="60" y="112" class="heading" font-size="34">Tools for building, testing and securing systems.</text><rect x="60" y="150" width="340" height="74" rx="13" class="panel"/><circle cx="88" cy="178" r="5" fill="#d4af37" class="pulse"/><text x="108" y="180" class="kicker" font-size="13">AI SECURITY</text><text x="84" y="206" class="small" font-size="15">Prompt injection · LLM red teaming</text><rect x="430" y="150" width="340" height="74" rx="13" class="panel"/><circle cx="458" cy="178" r="5" fill="#d4af37" class="pulse"/><text x="478" y="180" class="kicker" font-size="13">LANGUAGE</text><text x="454" y="206" class="small" font-size="15">Python · JavaScript · SQL · Bash</text><rect x="800" y="150" width="340" height="74" rx="13" class="panel"/><circle cx="828" cy="178" r="5" fill="#d4af37" class="pulse"/><text x="848" y="180" class="kicker" font-size="13">LLM / RAG</text><text x="824" y="206" class="small" font-size="15">LangChain · Ollama · FAISS · Chroma</text><rect x="60" y="246" width="340" height="74" rx="13" class="panel"/><circle cx="88" cy="274" r="5" fill="#d4af37" class="pulse"/><text x="108" y="276" class="kicker" font-size="13">INFRASTRUCTURE</text><text x="84" y="302" class="small" font-size="15">Docker · Kubernetes · Linux</text><rect x="430" y="246" width="340" height="74" rx="13" class="panel"/><circle cx="458" cy="274" r="5" fill="#d4af37" class="pulse"/><text x="478" y="276" class="kicker" font-size="13">OFFENSIVE SECURITY</text><text x="454" y="302" class="small" font-size="15">Burp Suite · Nmap · Metasploit</text><rect x="800" y="246" width="340" height="74" rx="13" class="panel"/><circle cx="828" cy="274" r="5" fill="#d4af37" class="pulse"/><text x="848" y="276" class="kicker" font-si