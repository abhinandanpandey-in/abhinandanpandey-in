name: Activity Pulse

on:
  schedule:
    - cron: "31 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abhinandanpandey-in
          filename: assets/metrics.activity.svg
          template: classic
          base: ""
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 4%
          config_animations: yes

          extras_css: |
            svg.large {
              background: linear-gradient(135deg, #070b16 0%, #0c1326 100%) !important;
              border: 1.5px solid rgba(36, 123, 255, 0.55) !important;
              border-radius: 22px !important;
              color: #e6eeff !important;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            }
            h2, h3 {
              color: #247bff !important;
              font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
              text-transform: uppercase;
              letter-spacing: 1.2px;
            }
            .field, .details {
              color: #b7c2dc !important;
            }
            strong, .bold {
              color: #f4f7ff !important;
            }
            .h-icon, svg.octicon {
              fill: #ff354f !important;
            }
            .isocalendar svg {
              filter: invert(0.92) hue-rotate(260deg) saturate(1.8) brightness(0.95) !important;
            }
